<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SARMS — School Academic Record Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%;background:#0F172A;color:#F1F5F9}
    body{font-family:'DM Sans',sans-serif;font-size:14px}
    .sarms-boot{height:100vh;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:16px;background:#0F172A}
    .sarms-boot-logo{width:72px;height:72px;border-radius:18px;
      background:linear-gradient(135deg,#2563EB,#1B3A8F);
      display:flex;align-items:center;justify-content:center;font-size:36px}
    .sarms-boot-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:#F1F5F9}
    .sarms-boot-sub{font-size:13px;color:#64748B}
    .sarms-boot-bar{width:220px;height:4px;background:#1E293B;border-radius:2px;overflow:hidden}
    .sarms-boot-fill{height:100%;background:linear-gradient(90deg,#2563EB,#3B82F6);
      border-radius:2px;animation:sl 1.8s ease-in-out infinite}
    @keyframes sl{0%{width:0%;margin-left:0%}50%{width:60%;margin-left:20%}100%{width:0%;margin-left:100%}}
  </style>
</head>
<body>
  <div id="root">
    <div class="sarms-boot">
      <div class="sarms-boot-logo">🏫</div>
      <div class="sarms-boot-title">SARMS</div>
      <div class="sarms-boot-sub">School Academic Record Management System</div>
      <div class="sarms-boot-bar"><div class="sarms-boot-fill"></div></div>
      <div class="sarms-boot-sub" style="font-size:12px;margin-top:4px">Starting...</div>
    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
